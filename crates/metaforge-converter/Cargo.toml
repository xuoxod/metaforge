[package]
name = "metaforge-converter"
version = "0.1.0"
edition = "2021"
authors = ["RMediaTech Contributors <contact@rmediatech.com>"]
license = "MIT"
description = "Sovereign zero-dependency multi-format image & media conversion and transcoding engine for MetaForge"
keywords = ["converter", "transcoder", "image", "audio", "wav"]
categories = ["multimedia::images", "multimedia::audio"]

[dependencies]
metaforge-core = { path = "../metaforge-core" }
metaforge-parsers = { path = "../metaforge-parsers" }
metaforge-sanitize = { path = "../metaforge-sanitize" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
symphonia = { version = "0.6.1", default-features = false, features = ["all-codecs", "all-formats", "all-meta"] }

[dev-dependencies]
tempfile = "3.6"
