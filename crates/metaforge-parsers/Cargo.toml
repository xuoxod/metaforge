[package]
name = "metaforge-parsers"
version = "0.2.0"
edition = "2021"
authors = ["RMediaTech Contributors <contact@rmediatech.com>"]
license = "MIT"
description = "Zero-copy binary container segment and box parsers for MetaForge"

[dependencies]
metaforge-core = { path = "../metaforge-core" }
kamadak-exif = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.6"
