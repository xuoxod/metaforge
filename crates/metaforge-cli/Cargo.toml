[package]
name = "metaforge"
version = "0.1.0"
edition = "2021"
authors = ["RMediaTech Contributors <contact@rmediatech.com>"]
license = "MIT"
description = "Sovereign High-Performance Image Metadata Extraction, Forensic Steganography & Privacy Sanitization Engine"
keywords = ["exif", "metadata", "forensics", "steganography", "sanitizer"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "metaforge"
path = "src/main.rs"

[dependencies]
metaforge-core = { path = "../metaforge-core" }
metaforge-parsers = { path = "../metaforge-parsers" }
metaforge-forensics = { path = "../metaforge-forensics" }
metaforge-sanitize = { path = "../metaforge-sanitize" }
clap = { version = "4.4", features = ["derive", "cargo"] }
comfy-table = "7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

[dev-dependencies]
tempfile = "3.6"
